; batch-local MT4 portable launcher for Volty DumpSeries rerun
; copy to portable_terminal\config\mt4probe_volty_dumpseries_portable.ini when needed

; common settings
EnableNews=false
; Login=
; Server=

; experts settings
ExpertsEnable=true
ExpertsDllImport=true
ExpertsExpImport=true
ExpertsTrades=false

; start strategy tester
TestExpert=Probe\MT4Probe_Volty
TestExpertParameters=MT4Probe_Volty_dumpseries_0_6.ini
TestSymbol=EURUSD
TestPeriod=H1
TestModel=0
TestOptimization=false
TestDateEnable=true
TestFromDate=2025.01.01
TestToDate=2025.01.15
TestVisualEnable=false
TestReplaceReport=true
TestReport=tester\files\mt4probe_volty_dumpseries_portable
TestShutdownTerminal=true
